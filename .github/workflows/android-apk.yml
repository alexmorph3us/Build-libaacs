name: Build libaacs Android provider APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'package/android/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/**'
      - 'm4/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.2.12479018
      MIN_API: 23
      LIBGPG_ERROR_VERSION: 1.61
      LIBGCRYPT_VERSION: 1.12.4
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config bison flex \
            build-essential gettext texinfo zip unzip curl ca-certificates

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and build tools
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"

          # Accept SDK licenses non-interactively.
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT"        >> "$GITHUB_ENV"

          # Discover where the NDK actually landed.
          NDK_DIR=""
          for candidate in \
              "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" \
              "$ANDROID_SDK_ROOT/ndk-bundle" \
              "$ANDROID_HOME/ndk/${NDK_VERSION}" \
              "$ANDROID_HOME/ndk-bundle"; do
            if [ -d "$candidate/toolchains/llvm/prebuilt/linux-x86_64/sysroot" ]; then
              NDK_DIR="$candidate"
              break
            fi
          done

          if [ -z "$NDK_DIR" ]; then
            NDK_DIR="$(find "$ANDROID_SDK_ROOT" "${ANDROID_HOME:-/nonexistent}" -maxdepth 3 \
                        -type d -path '*/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/sysroot' \
                        -print -quit 2>/dev/null | sed 's#/toolchains/llvm/prebuilt/linux-x86_64/sysroot##')" || true
          fi

          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot" ]; then
            echo "FATAL: could not locate NDK after sdkmanager install."
            echo "--- ANDROID_SDK_ROOT listing ---"
            ls -la "$ANDROID_SDK_ROOT"            || true
            echo "--- ndk dir listing ---"
            ls -la "$ANDROID_SDK_ROOT/ndk"       || true
            echo "--- ANDROID_HOME listing ---"
            ls -la "${ANDROID_HOME:-/nonexistent}" || true
            echo "--- sdkmanager --list_installed ---"
            sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed || true
            exit 1
          fi

          echo "Resolved ANDROID_NDK=$NDK_DIR"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Download pinned GNU crypto dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/sources"
          cd "$RUNNER_TEMP/sources"
          curl --fail --location --retry 3 -o "libgpg-error-${LIBGPG_ERROR_VERSION}.tar.bz2" \
            "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-${LIBGPG_ERROR_VERSION}.tar.bz2"
          curl --fail --location --retry 3 -o "libgcrypt-${LIBGCRYPT_VERSION}.tar.bz2" \
            "https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-${LIBGCRYPT_VERSION}.tar.bz2"
          tar -xf "libgpg-error-${LIBGPG_ERROR_VERSION}.tar.bz2"
          tar -xf "libgcrypt-${LIBGCRYPT_VERSION}.tar.bz2"

      - name: Build libaacs for all Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE"
          NDK="${ANDROID_NDK:?ANDROID_NDK is not set — did the NDK install step run?}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          SOURCES="$RUNNER_TEMP/sources"
          WORK="$RUNNER_TEMP/cross-build"
          mkdir -p "$WORK"

          # Sanity: the NDK layout must be what we think it is.
          echo "Using NDK at: $NDK"
          test -d "$TOOLCHAIN/sysroot" || {
            echo "FATAL: NDK sysroot missing at $TOOLCHAIN/sysroot"
            echo "--- NDK listing ---"
            ls -la "$NDK" 2>/dev/null || true
            echo "--- toolchains listing ---"
            ls -la "$NDK/toolchains" 2>/dev/null || true
            exit 1
          }
          test -x "$TOOLCHAIN/bin/llvm-ar" || {
            echo "FATAL: llvm-ar missing under $TOOLCHAIN/bin"
            ls -la "$TOOLCHAIN/bin" 2>/dev/null | head -n 60 || true
            exit 1
          }

          dump_log_head() {
            local logfile="$1"
            echo "===== ${logfile##*/} (first 400 lines) ====="
            sed -n '1,400p' "$logfile" || true
          }

          # Map ABI -> pre-generated lock-obj header shipped by libgpg-error.
          # Android is a cross build, so configure cannot run the probe program
          # that would normally measure the pthread lock size; it falls back to
          # src/syscfg/lock-obj-pub.linux-android.h, which upstream does not
          # ship, so we supply it from the closest matching pre-generated file.
                    lock_obj_for_abi() {
            local abi="$1"
            case "$abi" in
              arm64-v8a)
                echo "lock-obj-pub.aarch64-unknown-linux-androideabi.h"
                ;;
              armeabi-v7a)
                echo "lock-obj-pub.arm-unknown-linux-androideabi.h"
                ;;
              x86)
                echo "lock-obj-pub.i686-unknown-linux-androideabi.h"
                ;;
              x86_64)
                echo "lock-obj-pub.x86_64-unknown-linux-androideabi.h"
                ;;
              *)
                echo ""
                ;;
            esac
          }

          build_abi() {
            local abi="$1" triple="$2" host="$3"
            local prefix="$WORK/prefix-$abi"
            local build="$WORK/build-$abi"
            local sysroot="$TOOLCHAIN/sysroot"
            mkdir -p "$prefix" "$build"

            # --- Reset host build environment completely for this ABI ---
            unset LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH
            unset LDFLAGS CFLAGS CPPFLAGS CXXFLAGS CC CXX AR RANLIB NM STRIP LD
            unset PKG_CONFIG_PATH PKG_CONFIG_LIBDIR PKG_CONFIG_SYSROOT_DIR
            unset CC_FOR_BUILD CFLAGS_FOR_BUILD

            export CC="$TOOLCHAIN/bin/${triple}${MIN_API}-clang"
            export CXX="$TOOLCHAIN/bin/${triple}${MIN_API}-clang++"
            export LD="$TOOLCHAIN/bin/ld.lld"
            export AR="$TOOLCHAIN/bin/llvm-ar"
            export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
            export NM="$TOOLCHAIN/bin/llvm-nm"
            export STRIP="$TOOLCHAIN/bin/llvm-strip"

            for tool in "$CC" "$CXX" "$LD" "$AR" "$RANLIB" "$NM" "$STRIP"; do
              test -x "$tool" || { echo "FATAL: missing tool $tool"; exit 1; }
            done

            export CFLAGS="--sysroot=$sysroot -O2 -fPIC -I$prefix/include"
            export CXXFLAGS="$CFLAGS"
            export CPPFLAGS="--sysroot=$sysroot -I$prefix/include"
            export LDFLAGS="--sysroot=$sysroot -L$prefix/lib"

            export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig"
            export PKG_CONFIG_PATH=
            export PKG_CONFIG_SYSROOT_DIR=
            export PKG_CONFIG="pkg-config"

            echo "=========================================================="
            echo "===== ABI $abi (host=$host, CC=$CC) ====="
            echo "=========================================================="

            # ---------- libgpg-error ----------
            echo "===== Building libgpg-error for $abi ====="
            rm -rf "$WORK/gpg-error-$abi"
            mkdir "$WORK/gpg-error-$abi"
            tar -xf "$SOURCES/libgpg-error-${LIBGPG_ERROR_VERSION}.tar.bz2" \
              -C "$WORK/gpg-error-$abi" --strip-components=1
            pushd "$WORK/gpg-error-$abi"

            # --- FIX: supply the missing Android lock-obj header ---
            local lock_hdr
            lock_hdr="$(lock_obj_for_abi "$abi")"
            if [ -z "$lock_hdr" ]; then
              echo "FATAL: no lock-obj mapping for ABI $abi"
              popd
              exit 1
            fi
            if [ ! -f "src/syscfg/$lock_hdr" ]; then
              echo "FATAL: expected lock-obj source header not found: src/syscfg/$lock_hdr"
              ls -la src/syscfg/ || true
              popd
              exit 1
            fi
            cp "src/syscfg/$lock_hdr" src/syscfg/lock-obj-pub.linux-android.h
            echo "Installed lock-obj header: src/syscfg/$lock_hdr -> lock-obj-pub.linux-android.h"
            # --- end fix ---

            if ! ./configure --host="$host" --prefix="$prefix" \
                 --enable-static --disable-shared --disable-nls \
                 > configure.out 2>&1; then
              echo "----- libgpg-error configure failed -----"
              tail -n 60 configure.out || true
              if [ -f config.log ]; then dump_log_head config.log; fi
              popd
              exit 1
            fi
            if ! make -j2 > make.out 2>&1; then
              echo "----- libgpg-error make failed -----"
              tail -n 100 make.out || true
              popd
              exit 1
            fi
            make install
            popd

            # ---------- libgcrypt ----------
            echo "===== Building libgcrypt for $abi ====="
            rm -rf "$WORK/libgcrypt-$abi"
            mkdir "$WORK/libgcrypt-$abi"
            tar -xf "$SOURCES/libgcrypt-${LIBGCRYPT_VERSION}.tar.bz2" \
              -C "$WORK/libgcrypt-$abi" --strip-components=1
            pushd "$WORK/libgcrypt-$abi"
            if ! ./configure --host="$host" --prefix="$prefix" \
                 --with-gpg-error-prefix="$prefix" \
                 --enable-static --disable-shared --disable-asm \
                 --disable-doc --disable-nls \
                 > configure.out 2>&1; then
              echo "----- libgcrypt configure failed -----"
              tail -n 60 configure.out || true
              if [ -f config.log ]; then dump_log_head config.log; fi
              popd
              exit 1
            fi
            if ! make -j2 > make.out 2>&1; then
              echo "----- libgcrypt make failed -----"
              tail -n 100 make.out || true
              popd
              exit 1
            fi
            make install
            popd

            # ---------- libaacs ----------
            echo "===== Building libaacs for $abi ====="
            rm -rf "$SRC/build-$abi"
            mkdir "$SRC/build-$abi"
            pushd "$SRC/build-$abi"
            export PKG_CONFIG="pkg-config --static"
            export CFLAGS="--sysroot=$sysroot -O2 -fPIC -I$prefix/include"
            export LDFLAGS="--sysroot=$sysroot -L$prefix/lib -Wl,--exclude-libs,ALL"
            if ! "$SRC/configure" --host="$host" --prefix=/ \
                 --disable-static --enable-shared \
                 --with-libgcrypt-prefix="$prefix" \
                 > configure.out 2>&1; then
              echo "----- libaacs configure failed -----"
              tail -n 60 configure.out || true
              if [ -f config.log ]; then dump_log_head config.log; fi
              popd
              exit 1
            fi
            if ! make -j2 > make.out 2>&1; then
              echo "----- libaacs make failed -----"
              tail -n 100 make.out || true
              popd
              exit 1
            fi
            popd
            test -n "$(find "$SRC/build-$abi/.libs" -maxdepth 1 -type f -name 'libaacs.so*' -print -quit)" \
              || { echo "FATAL: libaacs.so not produced for $abi"; exit 1; }
          }

          bash "$SRC/bootstrap"
          build_abi arm64-v8a aarch64-linux-android aarch64-linux-android
          build_abi armeabi-v7a armv7a-linux-androideabi arm-linux-androideabi
          build_abi x86_64 x86_64-linux-android x86_64-linux-android
          build_abi x86 i686-linux-android i686-linux-android

          echo "READELF=$TOOLCHAIN/bin/llvm-readelf" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"

      - name: Create temporary signing keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Package and verify APK
        run: |
          export LIBAACS="$GITHUB_WORKSPACE"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export BUILD_TOOLS=35.0.0
          export READELF="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          export STRIP="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          bash ./package/android/build-apk-android.sh
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            package/android/out/libaacs-provider.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -v 16384 \
            package/android/out/libaacs-provider.apk
          sha256sum package/android/out/libaacs-provider.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaacs-provider-android-apk
          path: package/android/out/libaacs-provider.apk
          if-no-files-found: error
          retention-days: 30
